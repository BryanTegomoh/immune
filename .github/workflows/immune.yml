name: IMMUNE live experiment
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        type: choice
        options:
          - check-connections
          - memory-check
          - baseline
          - train
        default: check-connections
        required: true
      reviewed_cases:
        description: Training IDs whose labels and rationales you reviewed, comma-separated
        type: string
        default: ''
      confirm_reviewed:
        description: I approve the selected training labels and rationales in data/cases.json
        type: boolean
        default: false
      river_model:
        description: River model enabled for your API key
        type: string
        default: Qwen/Qwen3.5-9B
        required: true
permissions:
  contents: read
concurrency:
  group: immune-live-experiment
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install documented provider clients
        run: python -m pip install -r requirements.txt
      - name: Verify experiment integrity
        run: python -m unittest discover -s tests -v
      - name: Run requested operation
        env:
          RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
          GBRAIN_TOKEN: ${{ secrets.GBRAIN_TOKEN }}
          MEMORABLE_API_KEY: ${{ secrets.MEMORABLE_API_KEY }}
          GBRAIN_REMEMBER_ARGS: ${{ vars.GBRAIN_REMEMBER_ARGS }}
          GBRAIN_RECALL_ARGS: ${{ vars.GBRAIN_RECALL_ARGS }}
          RIVER_MODEL: ${{ inputs.river_model }}
          IMMUNE_OPERATION: ${{ inputs.operation }}
          IMMUNE_REVIEWED_CASES: ${{ inputs.reviewed_cases }}
          IMMUNE_CONFIRM_REVIEWED: ${{ inputs.confirm_reviewed }}
        run: python -m immune.ci
      - name: Save recorded results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immune-results-${{ github.run_id }}
          path: |
            runs/state.json
            runs/connection-check.json
            runs/memory-check.json
          if-no-files-found: ignore
          retention-days: 7
