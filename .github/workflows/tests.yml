name: IMMUNE integrity and autonomous-loop tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: node --test tests/hosted-api.test.js
      - run: npm run build:public
